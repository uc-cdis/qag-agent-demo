<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GDC QAG ReWOO</title>

    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/@pydantic/ai-chat-ui/dist/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.jsdelivr.net/npm/@pydantic/ai-chat-ui/dist/favicon.png" />

    <script type="module" crossorigin src="https://cdn.jsdelivr.net/npm/@pydantic/ai-chat-ui/dist/assets/index-BN5f5YQq.js"></script>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/npm/@pydantic/ai-chat-ui/dist/assets/index-B3O1eTMb.css">

    <style>
      #examples-box {
        margin: 12px auto 0;
        max-width: 1000px;
        padding: 14px 18px;
        border: 1.5px solid #cacaca;
        border-radius: 12px;
        background: #ffffff;
      }

      #examples-box p {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 600;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      #examples-box .chips {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #examples-box button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid #cacaca;
        background: #f9fafb;
        color: #374151;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }

      #examples-box button:hover {
        background: #f0fdf4;
        color: #111827;
      }

      @media (prefers-color-scheme: dark) {
        #examples-box {
          border-color: #3f3f46;
          background: transparent;
        }

        #examples-box button {
          border-color: #3f3f46;
          background: #18181b;
          color: #d4d4d8;
        }

        #examples-box button:hover {
          background: #27272a;
          color: #fafafa;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script>
      const SUGGESTIONS = [
        "What is the prevalence of BRAF SSMs in lung cancer?",
        "What is the prevalence of BRAF SSMs in lung cancer cases of non smoking women over 40?",
        "What is the average gene expression for TP53 and MUC16 in cases with lung adenocarcinoma?",
        "What is the average gene expression of BRAF in TCGA-BRCA?",
        "List the most variably expressed genes in APOLLO-LUAD.",
        "Compare the expression of TP53, MUC16, and BRAF in APOLLO-LUAD."
      ];

      const PLACEHOLDER_EMPTY =
        "Ask me a question about GDC data — example questions are available below.";

      const PLACEHOLDER_STARTED =
        "Ask me a question about GDC data.";

      // The chat UI is a React app, so plain `.value = x` is ignored. Use the
      // native setter and fire an input event the framework will notice.
      function setInputValue(input, text) {
        const proto =
          input.tagName === "TEXTAREA"
            ? window.HTMLTextAreaElement.prototype
            : window.HTMLInputElement.prototype;

        const setter = Object.getOwnPropertyDescriptor(proto, "value").set;
        setter.call(input, text);
        input.dispatchEvent(new Event("input", { bubbles: true }));
      }

      function findInput() {
        return document.querySelector("textarea, input[type='text']");
      }

      function submit(input) {
        const form = input.closest("form");

        const sendBtn =
          (form &&
            (form.querySelector("button[type='submit']") ||
              form.querySelector("button:last-of-type"))) ||
          document.querySelector("button[type='submit']");

        if (sendBtn && !sendBtn.disabled) {
          sendBtn.click();
          return;
        }

        // Fallback: most chat composers send on plain Enter.
        input.dispatchEvent(
          new KeyboardEvent("keydown", {
            key: "Enter",
            code: "Enter",
            keyCode: 13,
            which: 13,
            bubbles: true,
          })
        );
      }

      let conversationStarted = false;

      function removeBox() {
        const box = document.getElementById("examples-box");
        if (box) box.remove();
      }

      function buildBox(input) {
        const box = document.createElement("div");
        box.id = "examples-box";

        const label = document.createElement("p");
        label.textContent = "Example Questions";
        box.appendChild(label);

        const chips = document.createElement("div");
        chips.className = "chips";
        box.appendChild(chips);

        SUGGESTIONS.forEach(text => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = text;

          btn.addEventListener("click", () => {
            const live = findInput() || input;
            setInputValue(live, text);
            live.focus();
            // Let React flush the state update before submitting.
            setTimeout(() => submit(live), 50);
            markStarted();
          });

          chips.appendChild(btn);
        });

        return box;
      }

      function injectBox(input) {
        if (document.getElementById("examples-box")) return;

        const box = buildBox(input);
        const form = input.closest("form");
        const anchor = (form && form.parentElement) || input.parentElement;

        if (anchor && anchor.parentElement) {
          anchor.parentElement.insertBefore(box, anchor.nextSibling);
        } else {
          document.body.appendChild(box);
        }
      }

      function markStarted() {
        conversationStarted = true;
        removeBox();

        const input = findInput();
        if (input) input.setAttribute("placeholder", PLACEHOLDER_STARTED);
      }

      // Hide the examples once the user actually sends something, however they
      // send it: clicking the chips, hitting Enter, or clicking the send button.
      document.addEventListener("submit", markStarted, true);

      document.addEventListener(
        "keydown",
        event => {
          const input = findInput();
          if (!input || event.target !== input) return;
          if (event.key !== "Enter" || event.shiftKey) return;
          if (!input.value.trim()) return;
          markStarted();
        },
        true
      );

      const observer = new MutationObserver(() => {
        const input = findInput();
        if (!input) return;

        input.setAttribute(
          "placeholder",
          conversationStarted ? PLACEHOLDER_STARTED : PLACEHOLDER_EMPTY
        );

        if (conversationStarted) {
          removeBox();
        } else {
          injectBox(input);
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
