cases.diagnoses.weiss_assessment_score:
  description: 'The text term used to describe the overall Weiss assessment score,
    a commonly used assessment describing the malignancy of adrenocortical tumors.
    The Weiss score is determined based on nine histological criteria including the
    following: high nuclear grade, mitotic rate greater than five per 50 high power
    fields (HPF), atypical mitotic figures, eosinophilic tumor cell cytoplasm (greater
    than 75% tumor cells), diffuse architecture (greater than 33% of tumor), necrosis,
    venous invasion, sinusoidal invasion, and capsular invasion.'
